<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Church Lesson Attendance</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #27ae60;
            --danger: #c0392b;
            --warning: #d35400;
            --bg: #f4f6f9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            max-width: 480px;
            width: 100%;
            padding: 25px;
            box-sizing: border-box;
            text-align: center;
        }

        .header {
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .church-title {
            color: #888;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 6px 0;
        }

        .lesson-title {
            color: var(--primary);
            font-size: 1.5rem;
            margin: 6px 0;
        }

        .validity-box {
            background-color: #f0f4f8;
            border: 1px solid #d9e2ec;
            border-radius: 8px;
            padding: 12px;
            margin: 12px 0;
            font-size: 0.85rem;
            color: #334e68;
            line-height: 1.6;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
            display: inline-block;
            margin-top: 6px;
        }

        .status-active { background: #e8f5e9; color: var(--accent); }
        .status-expired { background: #fdecea; color: var(--danger); }
        .status-upcoming { background: #fef5e7; color: var(--warning); }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-size: 0.9rem;
            font-weight: 600;
        }

        input[type="text"], input[type="email"], input[type="datetime-local"], input[type="password"] {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        button {
            width: 100%;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }
        button.secondary { background-color: var(--primary); margin-top: 8px; }
        button.danger { background-color: var(--danger); margin-top: 8px; }

        .alert-box {
            display: none;
            padding: 16px;
            border-radius: 8px;
            margin-top: 10px;
            font-weight: 600;
            line-height: 1.4;
        }

        .alert-success { background: #e8f5e9; color: #2e7d32; }
        .alert-locked { background: #fdecea; color: #c0392b; border: 1px solid #f5c6cb; }

        .qr-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #qrcode {
            margin: 12px 0;
            padding: 10px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .portal-toggle {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #666;
            cursor: pointer;
            text-decoration: underline;
            background: none;
            border: none;
            width: auto;
            padding: 5px;
        }

        /* Teacher Portal Styles */
        #teacherPortal {
            display: none;
            margin-top: 20px;
            text-align: left;
            border-top: 3px solid var(--primary);
            padding-top: 20px;
        }

        .attendee-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 6px;
            padding: 10px;
            margin: 10px 0;
            background: #fafafa;
            font-size: 0.85rem;
        }

        .attendee-item {
            padding: 6px 0;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <p class="church-title">Grace Community Church</p>
            <h1 class="lesson-title" id="dispTitle">Lesson: Faith & Fellowship</h1>

            <div class="validity-box">
                <div><strong>Valid From:</strong> <span id="dispFrom"></span></div>
                <div><strong>Valid Until:</strong> <span id="dispUntil"></span></div>
                <div><strong>Location:</strong> <span id="dispLocation">Main Sanctuary</span></div>
            </div>

            <span id="statusBadge" class="status-badge status-active">Checking Status...</span>
        </div>

        <!-- ATTENDANCE FORM -->
        <form id="attendanceForm">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address (Optional)</label>
                <input type="email" id="email" placeholder="name@example.com">
            </div>

            <button type="submit">Mark Me Present</button>
        </form>

        <!-- LOCKED / EXPIRED MESSAGE -->
        <div id="lockedMessage" class="alert-box alert-locked"></div>

        <!-- SUCCESS MESSAGE -->
        <div id="successMessage" class="alert-box alert-success"></div>

        <!-- QR CODE DISPLAY -->
        <div class="qr-section">
            <p style="margin: 0; font-size: 0.9rem; color: #555; font-weight: 600;">Scan to Check In:</p>
            <div id="qrcode"></div>
            <p style="font-size: 0.75rem; color: #888; margin: 0;">QR code updates automatically with lesson times</p>
        </div>

        <!-- TEACHER PORTAL LOGIN BUTTON -->
        <button class="portal-toggle" onclick="openTeacherLogin()">🔒 Teacher Portal</button>

        <!-- TEACHER PORTAL PANEL -->
        <div id="teacherPortal">
            <h3 style="margin-top: 0; color: var(--primary);">Teacher Settings & Validity</h3>
            
            <div class="form-group">
                <label>Lesson / Sermon Title</label>
                <input type="text" id="editTitle">
            </div>

            <div class="form-group">
                <label>Location / Room</label>
                <input type="text" id="editLocation">
            </div>

            <div class="form-group">
                <label>Valid From (Date & Time)</label>
                <input type="datetime-local" id="editFrom">
            </div>

            <div class="form-group">
                <label>Valid Until (Date & Time)</label>
                <input type="datetime-local" id="editUntil">
            </div>

            <button onclick="saveLessonSettings()">Save & Update QR Code</button>

            <h3 style="margin-top: 25px; color: var(--primary);">Attendance Log (<span id="attendeeCount">0</span>)</h3>
            <div class="attendee-list" id="attendeeList">No check-ins recorded yet.</div>

            <button class="secondary" onclick="exportCSV()">Download Attendance (CSV)</button>
            <button class="danger" onclick="clearRecords()">Clear Attendance Log</button>
            <button class="portal-toggle" style="width:100%; text-align:center; margin-top:10px;" onclick="closeTeacherPortal()">Close Portal</button>
        </div>
    </div>

    <script>
        const TEACHER_PIN = "1234"; // Change your Teacher PIN here

        // Default Lesson Data (Set around current date)
        let lessonData = {
            title: "Lesson: Faith & Fellowship",
            location: "Main Sanctuary",
            validFrom: "2026-11-21T18:00",
            validUntil: "2026-11-22T23:59"
        };

        // Load settings from URL parameters (so scanned QR codes carry teacher settings) or localStorage
        function initApp() {
            const params = new URLSearchParams(window.location.search);
            const saved = JSON.parse(localStorage.getItem("churchLessonSettings"));

            if (params.has("title")) {
                lessonData.title = params.get("title");
                lessonData.location = params.get("loc") || "Main Sanctuary";
                lessonData.validFrom = params.get("from");
                lessonData.validUntil = params.get("until");
            } else if (saved) {
                lessonData = saved;
            }

            renderDisplay();
            checkValidityWindow();
            generateQRCode();
            renderAttendeeList();
        }

        function formatReadableDate(isoString) {
            if (!isoString) return "Not Set";
            const d = new Date(isoString);
            return d.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }) +
                   " – " + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function renderDisplay() {
            document.getElementById("dispTitle").textContent = lessonData.title;
            document.getElementById("dispLocation").textContent = lessonData.location;
            document.getElementById("dispFrom").textContent = formatReadableDate(lessonData.validFrom);
            document.getElementById("dispUntil").textContent = formatReadableDate(lessonData.validUntil);

            // Populate Teacher Portal inputs
            document.getElementById("editTitle").value = lessonData.title;
            document.getElementById("editLocation").value = lessonData.location;
            document.getElementById("editFrom").value = lessonData.validFrom;
            document.getElementById("editUntil").value = lessonData.validUntil;
        }

        function checkValidityWindow() {
            const now = new Date();
            const start = new Date(lessonData.validFrom);
            const end = new Date(lessonData.validUntil);

            const form = document.getElementById("attendanceForm");
            const lockedBox = document.getElementById("lockedMessage");
            const badge = document.getElementById("statusBadge");

            if (now < start) {
                form.style.display = "none";
                lockedBox.style.display = "block";
                lockedBox.innerHTML = `⏳ <strong>Check-in Not Open
